[project]
name = "ae4904"
version = "0.1.0"
description = "Code for AE4904 Detailed Design Project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.0a1",
]

[tool.pytest.ini_options]
pythonpath = ["packages/edac_simulation"]
testpaths = ["packages/edac_simulation/tests"]
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]
filterwarnings = [
    # galois library uses its own deprecated Field() alias internally
    "ignore::DeprecationWarning:galois",
]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
edac = { workspace = true }

[tool.ruff]
line-length = 88
